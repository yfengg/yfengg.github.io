<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Yana Feng</title>
  <meta name="description" content="Yana Feng: tools, data and paintings, from a small desk in Kowloon.">
  <meta property="og:title" content="Yana Feng">
  <meta property="og:image" content="https://yanajf.com/assets/gallery/art-1.jpeg">
  <meta name="theme-color" content="#0a0b12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%239e211b'/%3E%3Crect x='2' y='2' width='12' height='12' fill='none' stroke='%23e7bd62' stroke-width='1'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Serif:wght@500;700&family=Noto+Serif+TC:wght@600;900&family=VT323&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&text=%E5%A4%A7%E6%8A%BC%E9%85%92%E5%AE%B6%E5%86%B0%E5%AE%A4%E6%97%85%E9%A4%A8%E8%97%A5%E6%88%BF%E9%BA%BB%E9%9B%80%E8%8C%B6%E9%A4%90%E5%BB%B3%E9%87%91%E8%88%96&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">

  <!-- three.js (3D) and page-flip (the sketchbook), pinned versions -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="view" aria-label="First-person view from a desk in a small Kowloon flat. The Index button lists everything here as plain links."></canvas>

  <div class="bar top">
    <a class="sign" href="#" aria-label="Yana Feng"><span class="zh" id="signZh">馮</span><span class="en">YANA FENG</span></a>
  </div>

  <div id="tip" hidden></div>
  <div id="held" hidden></div>
  <div id="full" hidden></div>
  <button type="button" class="tagbtn putdown" id="putdown" hidden><span class="zh">放下</span><span class="en">PUT IT DOWN</span></button>
  <nav id="index" hidden aria-label="Everything on the desk"></nav>

  <div class="bar bottom">
    <span class="first-hint" id="hint">move around to look · click what catches your eye</span>
    <button type="button" class="tagbtn" id="indexBtn" aria-expanded="false" aria-controls="index"><span class="zh">目錄</span><span class="en">INDEX</span></button>
  </div>

  <div id="loading"><span id="loadingText">switching on the lamp…</span></div>
</body>
</html>
